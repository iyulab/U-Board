name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Cheapest check first — fail fast before the slower test/build steps.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build library entry
        run: npm run build:lib

      # Slowest/most expensive check last. jsdom (the `Test` step above) can't render <canvas> or
      # custom-element shadow DOM at all, so it can't tell a real chart from a silent fallback —
      # only a real browser can catch that regression class (see e2e/chart-rendering.spec.ts).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/core

      - name: E2E
        run: npm run test:e2e
