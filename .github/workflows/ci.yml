name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, because a run on main may be in the
  # middle of the `publish` job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Cheapest checks first — fail fast before the slower test/build steps.
      - name: Tooling script tests
        run: npm run test:tooling

      # Catches dependencies sitting behind already-published versions — `npm install`/`npm ci`
      # doesn't re-resolve an already-satisfying lockfile entry, so this drift is otherwise
      # silent. New majors must be adopted or deferred with a review date in
      # dependency-deferrals.json (see scripts/check-pin-drift.mjs). Also runs weekly
      # (dependency-drift.yml).
      - name: Dependency drift
        run: npm run check:pin-drift

      # This repository is public: tracked text must not carry work-tracking ids, paths into
      # private notes or a local machine, or hosts of real deployments. Hosts are checked against
      # an allowlist rather than a denylist, which would itself publish them (see
      # scripts/check-public-text.mjs).
      - name: Public text (no private context)
        run: npm run check:public-text

      # Relative links in the Markdown docs must reach a file (and heading) that exists — nothing
      # else follows them, so a moved file leaves them broken silently (scripts/check-doc-links.mjs).
      - name: Doc links
        run: npm run check:doc-links

      - name: Typecheck
        run: npm run typecheck

      # oxlint, not ESLint: typescript-eslint cannot load the native TypeScript 7 compiler this
      # workspace uses (.oxlintrc.json).
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Separate from the Test step above (not just merged into `npm test`) so it never competes
      # for resources with everything else's parallel PGlite-per-test-file startup — see
      # packages/server/vitest.config.ts. ubuntu-latest ships Docker preinstalled, so this needs
      # no extra setup here.
      - name: Test (Postgres concurrency, real container)
        run: npm run test:postgres --workspace=packages/server

      - name: Build
        run: npm run build

      - name: Build library entry
        run: npm run build:lib

      # Slowest/most expensive check last. jsdom (the `Test` step above) can't render <canvas> or
      # custom-element shadow DOM at all, so it can't tell a real chart from a silent fallback —
      # only a real browser can catch that regression class (see e2e/chart-rendering.spec.ts).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/core

      - name: Install Chromium (console)
        run: npx playwright install --with-deps chromium
        working-directory: packages/console

      - name: E2E
        run: npm run test:e2e

  # The packages declare `engines.node >=22.12.0` — the oldest supported Node line, and the floor
  # Vite itself requires. `verify` runs on the current line only, so without this job the declared
  # floor would be a claim nothing checks. Unit tests, typecheck and the library build are what a
  # consumer on that line relies on; the browser e2e suite does not depend on the Node version.
  node-floor:
    name: node-floor (22.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library entry
        run: npm run build:lib

  # Publishes the library package (packages/core, @iyulab/u-board) once `verify` and `node-floor` have passed on a
  # push to main, if its version isn't on the registry yet. Kept in this workflow rather than a
  # separate one so the commit that gets published is exactly the commit that was verified — and
  # so provenance records that commit. The server, console and share workspaces are applications
  # and stay private.
  publish:
    name: publish
    needs: [verify, node-floor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for `npm publish --provenance` (set through publishConfig).
      id-token: write
    defaults:
      run:
        working-directory: packages/core

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          echo "spec=${NAME}@${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "### Skipped — ${NAME}@${VERSION} is already published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.check.outputs.exists == 'false'
        run: npm ci
        working-directory: .

      # `prepack` (packages/core/scripts/prepack.mjs) rebuilds dist/lib from clean and copies in
      # the LICENSE.
      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: |
          npm publish
          echo "### Published ${{ steps.check.outputs.spec }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
