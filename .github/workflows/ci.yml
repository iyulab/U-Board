name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Cheapest checks first — fail fast before the slower test/build steps.
      - name: Tooling script tests
        run: npm run test:tooling

      # Catches a sibling-package pin (`@iyulab/u-widgets`, `@canvas-kit/*`) sitting behind its
      # already-published version — `npm install`/`npm ci` doesn't re-resolve an already-
      # satisfying lockfile entry, so this drift is otherwise silent (see
      # scripts/check-pin-drift.mjs and the umbrella's HISTORY.md, cycle-61).
      - name: Pin drift (sibling packages)
        run: npm run check:pin-drift

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Separate from the Test step above (not just merged into `npm test`) so it never competes
      # for resources with everything else's parallel PGlite-per-test-file startup — see
      # packages/server/vitest.config.ts. ubuntu-latest ships Docker preinstalled, so this needs
      # no extra setup here.
      - name: Test (Postgres concurrency, real container)
        run: npm run test:postgres --workspace=packages/server

      - name: Build
        run: npm run build

      - name: Build library entry
        run: npm run build:lib

      # Slowest/most expensive check last. jsdom (the `Test` step above) can't render <canvas> or
      # custom-element shadow DOM at all, so it can't tell a real chart from a silent fallback —
      # only a real browser can catch that regression class (see e2e/chart-rendering.spec.ts).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/core

      - name: Install Chromium (console)
        run: npx playwright install --with-deps chromium
        working-directory: packages/console

      - name: E2E
        run: npm run test:e2e
