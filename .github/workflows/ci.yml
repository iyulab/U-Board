name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, because a run on main may be in the
  # middle of the `publish` job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # The checks themselves live in scripts/check.mjs, so a local `npm run check` runs exactly this
      # list. Only machine setup stays here: the browsers its last step (E2E) drives. ubuntu-latest
      # ships Docker preinstalled, which its Postgres and image steps need.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/core

      - name: Install Chromium (console)
        run: npx playwright install --with-deps chromium
        working-directory: packages/console

      - name: Check
        run: npm run check

  # Each package declares the oldest Node it supports in `engines.node`. `verify` runs on the current
  # line only, so without this job the declared floors would be claims nothing checks. It runs the
  # product on its floor, not the test toolchain: the published library's entry point
  # (scripts/smoke-library.mjs) on the library's floor (22.12), and the server's suite on the
  # application's (22.22 — the console's router requires it to build, and the server's HTTP client
  # to run). Browser code is unit-tested under jsdom in `verify` — its Node version is the tooling's,
  # not the product's, and the test toolchain (jsdom among it) needs a newer Node than the floor.
  node-floor:
    name: node-floor (library 22.12, server 22.22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build library entry
        run: npm run build:lib

      - name: Library smoke
        run: npm run smoke:library

      # No native modules in the install, so the same node_modules serves the server's floor.
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22"

      - name: Server tests
        run: npm test --workspace=packages/server

  # Publishes the library package (packages/core, @iyulab/u-board) once `verify` and `node-floor` have passed on a
  # push to main, if its version isn't on the registry yet. Kept in this workflow rather than a
  # separate one so the commit that gets published is exactly the commit that was verified — and
  # so provenance records that commit. The server, console and share workspaces are applications
  # and stay private.
  publish:
    name: publish
    needs: [verify, node-floor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for `npm publish --provenance` (set through publishConfig).
      id-token: write
    defaults:
      run:
        working-directory: packages/core

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          echo "spec=${NAME}@${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "### Skipped — ${NAME}@${VERSION} is already published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.check.outputs.exists == 'false'
        run: npm ci
        working-directory: .

      # `prepack` (packages/core/scripts/prepack.mjs) rebuilds dist/lib from clean and copies in
      # the LICENSE.
      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: |
          npm publish
          echo "### Published ${{ steps.check.outputs.spec }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
