name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand on main: finishes a release whose run cannot be re-run (GitHub refuses to retry a run that
  # failed while scheduling its jobs). Publishing stays as safe as on a push.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, because a run on main may be in the
  # middle of the `publish` job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # The checks themselves live in scripts/check.mjs, so a local `npm run check` runs exactly this
      # list. Only machine setup stays here: the browser its last step (E2E) drives.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/core

      - name: Check
        run: npm run check

  # The package declares the oldest Node it supports in `engines.node`. `verify` runs on the current line only,
  # so without this job the declared floor would be a claim nothing checks. It runs the library's entry points
  # (scripts/smoke-library.mjs) on that floor, not the test toolchain, which needs a newer Node.
  node-floor:
    name: node-floor (library 22.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build library entry
        run: npm run build:lib

      - name: Library smoke
        run: npm run smoke:library

  # Publishes the library (packages/core, @iyulab/u-board) once `verify` and `node-floor` have passed on a push to
  # main, only if its version isn't on the registry yet. Kept in this workflow rather than a separate one so the
  # commit that gets published is exactly the commit that was verified — and so provenance records that commit.
  publish:
    name: publish
    needs: [verify, node-floor]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for `npm publish --provenance` (set through publishConfig).
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Find the versions not yet published
        id: check
        run: |
          pending=""
          for dir in packages/core; do
            NAME=$(node -p "require('./${dir}/package.json').name")
            VERSION=$(node -p "require('./${dir}/package.json').version")
            # Only npm's 404 means "not published yet"; any other failure (registry down, rate limit)
            # stops here instead of trying to publish a version that may already exist.
            if out=$(npm view "${NAME}@${VERSION}" version 2>&1); then
              echo "### Skipped — ${NAME}@${VERSION} is already published" >> "$GITHUB_STEP_SUMMARY"
            elif grep -q E404 <<< "${out}"; then
              pending="${pending} ${dir}"
            else
              echo "${out}" >&2
              echo "::error::Could not ask npm whether ${NAME}@${VERSION} is published"
              exit 1
            fi
          done
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.check.outputs.pending != ''
        run: npm ci

      # Each package's `prepack` (scripts/prepack.mjs) rebuilds its dist from clean and copies in the
      # LICENSE. A prerelease goes out under `next`, never as `latest` (npm refuses one without a tag).
      - name: Publish
        if: steps.check.outputs.pending != ''
        run: |
          for dir in ${{ steps.check.outputs.pending }}; do
            SPEC=$(node -p "const p=require('./${dir}/package.json'); p.name+'@'+p.version")
            case "${SPEC##*@}" in *-*) TAG=next ;; *) TAG=latest ;; esac
            (cd "${dir}" && npm publish --tag "${TAG}")
            echo "### Published ${SPEC} (${TAG})" >> "$GITHUB_STEP_SUMMARY"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
